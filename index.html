<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Plank — Year Tracker</title>
    <script>
      // Resolve theme (localStorage > system) and apply the .dark class before
      // React mounts so the first paint already matches the user's choice.
      (function () {
        try {
          var stored = localStorage.getItem('plank-theme');
          var pref = stored === 'light' || stored === 'dark' || stored === 'system'
            ? stored
            : 'system';
          var wantsDark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (wantsDark) document.documentElement.classList.add('dark');
          document.documentElement.dataset.theme = pref;
        } catch (e) {
          // localStorage may be unavailable — fall back to system preference.
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
